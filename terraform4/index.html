<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Bootcamp 2026 - Student Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px 48px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    text-align: center;
    max-width: 380px;
    width: 100%;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 20px;
    animation: pulse 2.5s ease-in-out infinite;
  }
  .name {
    font-size: 1.8rem;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 8px;
  }
  .detail {
    color: #6b7280;
    font-size: 1rem;
    line-height: 1.6;
  }
  .detail strong { color: #111827; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">DevOps Bootcamp 2026</div>
    <div class="name">Saxani</div>
    <div class="detail">
      Cohort: <strong>Terraform 4</strong><br>
      Role: <strong>DevOps Engineer</strong>
    </div>
  </div>
</body>
</html>
